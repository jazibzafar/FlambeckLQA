[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "LQAPy"
version = "0.1.0"
description = "Label Quality Assessment for the Flambeck Site."
readme = "README.md"
requires-python = ">=3.8"

# Paste your extracted dependencies here:
dependencies = [
    "geopandas==1.1.1",
    "matplotlib==3.6.3",
    "numpy==1.24.2",
    "opencv_python==4.11.0.86",
    "opencv_python_headless==4.10.0.84",
    "peft==0.12.0",
    "pyproj==3.5.0",
    "rasterio==1.4.3",
    "Shapely==2.2.0",
    "timm==1.0.30",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "tqdm==4.64.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]